name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

jobs:
  test:
    name: Cargo Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        working-directory: webrtc-cloak-rs
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static musl (10 architectures, zero libc/C deps)
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-aarch64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7hf
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7
            target: armv7-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armhf
            target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-arm
            target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv5te
            target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-i686
            target: i686-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-riscv64
            target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-loongarch64
            target: loongarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-powerpc64le
            target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          # macOS (Apple Silicon + Intel)
          - asset: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          - asset: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          # Windows MSVC (x86_64 + ARM64 + i686)
          - asset: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-i686
            target: i686-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        working-directory: webrtc-cloak-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}"

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        working-directory: webrtc-cloak-rs
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact (tar.gz)
        if: matrix.pkg == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="webrtc-cloak-${TAG}-${{ matrix.asset }}"
          mkdir -p "release_out/${NAME}"
          cp "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak" "release_out/${NAME}/webrtc-cloak"
          chmod +x "release_out/${NAME}/webrtc-cloak"
          cp README.md LICENSE "release_out/${NAME}/"
          tar -C release_out -czf "release_out/${NAME}.tar.gz" "${NAME}"
          rm -rf "release_out/${NAME}"

      - name: Package artifact (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $name = "webrtc-cloak-$tag-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "release_out/$name" | Out-Null
          Copy-Item "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak.exe" "release_out/$name/webrtc-cloak.exe"
          Copy-Item "README.md", "LICENSE" "release_out/$name/"
          Compress-Archive -Path "release_out/$name" -DestinationPath "release_out/$name.zip" -Force
          Remove-Item -Recurse -Force "release_out/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: release_out/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true

      - name: Generate SHA256SUMS and create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          cd all_assets
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - "$TAG" <<'PYEOF'
          import sys
          tag = sys.argv[1]
          notes = f"""## WebRTC-Cloak {tag} (Production-Freeze)

          Pure-Rust, zero-C-dependency RFC 7983 WebRTC (ICE STUN + DTLS 1.3/1.2 `dimpl` + Dual-SSRC Chrome `0x90` SRTP + Compound SRTCP) single-port UDP encapsulation research prototype.

          ### Included Platforms (16 OS / Arch Builds)
          - **Linux Static musl (zero libc/C dependency)**: `x86_64`, `aarch64`, `armv7hf`, `armv7`, `armhf`, `arm`, `armv5te`, `i686`, `riscv64`, `loongarch64`, `powerpc64le`
          - **macOS**: `arm64` (Apple Silicon), `x86_64` (Intel)
          - **Windows (MSVC)**: `x86_64`, `arm64`, `i686`
          - **Checksums**: `SHA256SUMS.txt`

          ### Key Highlights
          - **RFC 9147 DTLS 1.3 + DTLS 1.2 Auto-Sense (`dimpl 0.9.0`) & Anti-Downgrade Lock**:
            - Encrypts mutual ECDSA P-256 certificates inside `0x2e` Unified Ciphertext records and cuts 1 full RTT off WAN handshakes while staying 100% rolling-upgrade compatible with `v0.3.5` DTLS 1.2 peers
            - Optional `--dtls-min-version 1.3` locks `Dtls::new_13` to eliminate downgrade exposure once both ends run `v0.3.6+`; pre-built multi-MTU `DtlsConfig` pool randomizes ClientHello sizes with zero runtime validation cost; Ready-state Flight 5 retransmit driver prevents single-packet handshake blackholes
          - **Dual-SSRC Audio/Video SRTP (`PT=111` Opus + `PT=96` Video) & Orthogonal Nonce Domains**:
            - Jittered small-packet routing (`180..307B`) with RFC 7587 `<= 50 pps` Opus rate cap (overflow ACKs spill smoothly to `PT=96`), strict RFC 3550 Video `M=1` end-of-frame timestamp causality, shared global `0xBEDE` TWCC sequence, and independent 2048-packet RFC 6479 replay rings
            - Fail-Closed Hybrid PFS (`PSK + ECDHE KeyingMaterial`), high-16-bit disjoint Audio/Video SSRCs + `dir | 0x40` / `dir | 0x80` Nonce domain separation, and sequence exhaustion guard
          - **Hardened State Machines & Compound SRTCP**:
            - Zero-alloc pre-auth STUN parser, `Ready`-state DTLS liveness isolation, strict `ServerHello` framing checks, Make-Before-Break `Closing` drain (zero ICMP bounce), adaptive blackhole retry damping, 0-based SRTCP index with session-constant CNAME and dual-SSRC reporting
          - **Dual-mode 12-scenario `webrtc-cloak selftest` suite** (`--server-host` live remote mode with in-band `0xFFFE` SRTP probe echo + `--local` offline fault-injection sandbox + CPU crypto/P-256 benchmarks)
          - Default single-threaded `mio` reactor (`--workers 1`), optional multi-worker `--workers <N|auto>`, 32-bit safe arithmetic across all 16 build targets

          > **Disclaimer**: Strictly for network protocol learning, academic research, and authorized testing under the MIT License.
          """
          lines = [line[10:] if line.startswith(" " * 10) else line for line in notes.splitlines()]
          open("/tmp/release_notes.md", "w", encoding="utf-8").write("\n".join(lines).strip() + "\n")
          PYEOF
          gh release create "$TAG" ./* \
            --title "WebRTC-Cloak $TAG" \
            --notes-file /tmp/release_notes.md \
            --latest || gh release upload "$TAG" ./* --clobber
