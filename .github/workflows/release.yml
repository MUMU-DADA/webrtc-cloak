name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

jobs:
  test:
    name: Cargo Test (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        working-directory: webrtc-cloak-rs
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static musl (10 architectures, zero libc/C deps)
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-aarch64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7hf
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7
            target: armv7-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armhf
            target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-arm
            target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv5te
            target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-i686
            target: i686-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-riscv64
            target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-loongarch64
            target: loongarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-powerpc64le
            target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          # macOS (Apple Silicon + Intel)
          - asset: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          - asset: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          # Windows MSVC (x86_64 + ARM64 + i686)
          - asset: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-i686
            target: i686-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        working-directory: webrtc-cloak-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}"

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        working-directory: webrtc-cloak-rs
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact (tar.gz)
        if: matrix.pkg == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="webrtc-cloak-${TAG}-${{ matrix.asset }}"
          mkdir -p "release_out/${NAME}"
          cp "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak" "release_out/${NAME}/webrtc-cloak"
          chmod +x "release_out/${NAME}/webrtc-cloak"
          cp README.md LICENSE "release_out/${NAME}/"
          tar -C release_out -czf "release_out/${NAME}.tar.gz" "${NAME}"
          rm -rf "release_out/${NAME}"

      - name: Package artifact (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $name = "webrtc-cloak-$tag-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "release_out/$name" | Out-Null
          Copy-Item "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak.exe" "release_out/$name/webrtc-cloak.exe"
          Copy-Item "README.md", "LICENSE" "release_out/$name/"
          Compress-Archive -Path "release_out/$name" -DestinationPath "release_out/$name.zip" -Force
          Remove-Item -Recurse -Force "release_out/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: release_out/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true

      - name: Generate SHA256SUMS and create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          cd all_assets
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - "$TAG" <<'PYEOF'
          import sys
          tag = sys.argv[1]
          notes = f"""## WebRTC-Cloak {tag} (Production-Freeze)

          Pure-Rust, zero-C-dependency RFC 7983 WebRTC (ICE STUN + DTLS 1.2 `dimpl` + Chrome `0x90` SRTP + Compound SRTCP) single-port UDP encapsulation research prototype.

          ### Included Platforms (16 OS / Arch Builds)
          - **Linux Static musl (zero libc/C dependency)**: `x86_64`, `aarch64`, `armv7hf`, `armv7`, `armhf`, `arm`, `armv5te`, `i686`, `riscv64`, `loongarch64`, `powerpc64le`
          - **macOS**: `arm64` (Apple Silicon), `x86_64` (Intel)
          - **Windows (MSVC)**: `x86_64`, `arm64`, `i686`
          - **Checksums**: `SHA256SUMS.txt`

          ### Key Highlights
          - Real 6-flight mutual-certificate ECDSA P-256 DTLS 1.2 (`dimpl 0.9.0`) with Hybrid PFS (`PSK + ECDHE KeyingMaterial`)
          - Chrome `0x90` (`P=0, X=1, 0xBEDE`) SRTP with inside-AEAD random padding & wall-clock 90 kHz timestamps
          - RFC 3550 compliant Compound SRTCP (`PT=200/201`, encrypted trailing `BYE`), 64-bit sliding anti-replay window, `Closing(250ms)` drain
          - Default single-threaded `mio` reactor (`--workers 1`, 900+ Mbps on N5105), optional multi-worker `--workers <N|auto>`
          - RFC 7675 §5.1 peer liveness auto-recovery on server restart or CGNAT rebinding

          > **Disclaimer**: Strictly for network protocol learning, academic research, and authorized testing under the MIT License.
          """
          lines = [line[10:] if line.startswith(" " * 10) else line for line in notes.splitlines()]
          open("/tmp/release_notes.md", "w", encoding="utf-8").write("\n".join(lines).strip() + "\n")
          PYEOF
          gh release create "$TAG" ./* \
            --title "WebRTC-Cloak $TAG" \
            --notes-file /tmp/release_notes.md \
            --latest || gh release upload "$TAG" ./* --clobber
