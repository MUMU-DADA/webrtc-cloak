name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.1)"
        required: true
        default: "v0.3.1"

permissions:
  contents: write

jobs:
  test:
    name: Cargo Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        working-directory: webrtc-cloak-rs
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static musl (10 architectures, zero libc/C deps)
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-aarch64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7hf
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7
            target: armv7-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armhf
            target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-arm
            target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv5te
            target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-i686
            target: i686-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-riscv64
            target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-loongarch64
            target: loongarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-powerpc64le
            target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          # macOS (Apple Silicon + Intel)
          - asset: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          - asset: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          # Windows MSVC (x86_64 + ARM64 + i686)
          - asset: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-i686
            target: i686-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        working-directory: webrtc-cloak-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}"

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        working-directory: webrtc-cloak-rs
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact (tar.gz)
        if: matrix.pkg == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="webrtc-cloak-${TAG}-${{ matrix.asset }}"
          mkdir -p "release_out/${NAME}"
          cp "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak" "release_out/${NAME}/webrtc-cloak"
          chmod +x "release_out/${NAME}/webrtc-cloak"
          cp README.md LICENSE "release_out/${NAME}/"
          tar -C release_out -czf "release_out/${NAME}.tar.gz" "${NAME}"
          rm -rf "release_out/${NAME}"

      - name: Package artifact (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $name = "webrtc-cloak-$tag-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "release_out/$name" | Out-Null
          Copy-Item "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak.exe" "release_out/$name/webrtc-cloak.exe"
          Copy-Item "README.md", "LICENSE" "release_out/$name/"
          Compress-Archive -Path "release_out/$name" -DestinationPath "release_out/$name.zip" -Force
          Remove-Item -Recurse -Force "release_out/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: release_out/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true

      - name: Generate SHA256SUMS and create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          cd all_assets
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - "$TAG" <<'PYEOF'
          import sys
          tag = sys.argv[1]
          notes = f"""## WebRTC-Cloak {tag} (Production-Freeze)

          Pure-Rust, zero-C-dependency RFC 7983 WebRTC (ICE STUN + DTLS 1.3/1.2 `dimpl` + Dual-SSRC Chrome `0x90` SRTP + Compound SRTCP) single-port UDP encapsulation research prototype.

          ### Included Platforms (16 OS / Arch Builds)
          - **Linux Static musl (zero libc/C dependency)**: `x86_64`, `aarch64`, `armv7hf`, `armv7`, `armhf`, `arm`, `armv5te`, `i686`, `riscv64`, `loongarch64`, `powerpc64le`
          - **macOS**: `arm64` (Apple Silicon), `x86_64` (Intel)
          - **Windows (MSVC)**: `x86_64`, `arm64`, `i686`
          - **Checksums**: `SHA256SUMS.txt`

          ### Key Highlights
          - **First-Class Out-of-Band ECMP Lane-Hunting Bypass Mode (`webrtc-cloak bypass`, `v0.5.0`)**:
            - New top-level `bypass` forwarder mode and `bypass --responder` ultra-lightweight STUN responder mode alongside `client` and `server`
            - Performs multi-candidate authenticated RFC 8445 ICE STUN ECMP lane hunting, continuous RTT/jitter guard, seamless NAT-rebinding port switch with 3s old-port drain overlap, and blackhole auto-escape on the exact same UDP 5-tuple while passing 100% of inner UDP payloads (e.g., QUIC) raw with zero framing overhead, zero double-encryption, and full kernel `UDP_SEGMENT` (UDP GSO) compatibility
          - **Session Socket Burst-Buffer Sizing (`v0.4.7`, 100% wire-compatible with `v0.4.x`)**:
            - Raised server per-session `backend_sock` kernel buffer ceiling from `512 KiB` to `4 MiB` and client upstream `up_sock` ceiling from `2 MiB` to `8 MiB` (matching `listen_sock`), eliminating `Udp: RcvbufErrors` during sub-vCPU hypervisor scheduling pauses and multi-hop L4 relay micro-bursts with zero idle RSS increase
          - **Opt-In Linux UDP Batch I/O (`--udp-batch <0|2..64>`, `v0.4.6`, 100% wire-compatible with `v0.4.x`)**:
            - Disabled by default (`--udp-batch 0`, zero extra buffer allocation, preserves exact single-packet path and ~2 MiB router footprint)
            - When enabled on Linux (e.g. `--udp-batch 32`), accelerates all four hot loops (server/client uplink & downlink) with pre-allocated zero-copy `recvmmsg` / `sendmmsg` batching across IPv4 and IPv6, slashing syscall and KVM VM-exit/KPTI overhead by an order of magnitude while keeping strict control-frame ordering and exact byte/packet telemetry; non-Linux platforms safely fall back to single-packet I/O
          - **Universal Multi-Metric Adaptive Lane Scoring & Continuous Reinforcement (`v0.4.5`, 100% wire-compatible with `v0.4.x`)**:
            - **Zero-hardcoded-threshold cold-start calibration (`--lane-target-rtt 0`)**: automatically samples across multiple staggered STUN rounds (`>= 2` rounds / up to 3 rounds for background `PreWarm`) with universal early-settle `(best_rtt + 45ms).clamp(80, 550)` to lock onto the global minimum RTT across 5ms–250ms geographies
            - **Zero-wire-overhead SRTP data-plane packet loss + composite lane score (`0–100`)**: `SrtpCloakCipher::rx_settled_stats()` tracks exact downlink loss across Video+Audio SSRCs while excluding the trailing 24-packet reorder tail (0% false loss under heavy ECMP reordering) and isolating 1-RTT migration gaps via `reset_rx_loss_epoch()`; catches low-RTT throttled/lossy ("fake-good") lanes (`>= 8%` loss) and escapes via 0ms MBB `0xFFFC` handover
            - **Canary trial confirmation & anti-flap hysteresis**: new/switched lanes confirm after 2 clean windows (`lane_confirmed = true`) or fast-escape on trial failure with 2^k exponential backoff during network-wide congestion; strict target-vs-degrade hysteresis, smoothed EWMA downward reinforcement, and gentle upward baseline relaxation prevent trap-band loops
            - **Extended telemetry**: exposes `data_loss_pct`, `lane_score`, `lane_best_rtt_ms`, and `lane_confirmed` in `/status` JSON and `/metrics` Prometheus
          - **Full Dual-Stack IPv6 & Non-Blocking ECMP Fast-Lane Hunting (`v0.4.4`)**:
            - End-to-end IPv4/IPv6 dual-stack support across `client`, `server`, `selftest`, and `bench_tools` (`RFC 5389 §15.2` IPv6 `XOR-MAPPED-ADDRESS`, 48B IPv6+UDP outer MTU/DTLS accounting, bracketed & raw IPv6 CLI parsing)
            - Optional `--lane-hunt` non-blocking ECMP lane hunter (`--lane-probes`, `--lane-rounds`, `--lane-target-rtt`, `--lane-cooldown`): staggered multi-candidate startup STUN race with DTLS 1.3 pre-warm, continuous RTT-degradation guard triggering background MBB `0xFFFC` handover (0 backend port change), multi-candidate racing during scheduled rotations & 1-RTT blackhole migrations, and `lane_hunts_total` / `lane_switches_total` telemetry
            - Fixed Linux `epoll` `mio::Waker` early-drop shutdown race in `TelemetryHub::shutdown()` so `--status-http` tears down deterministically across Linux, macOS, and Windows
          - **Binary Size, Memory & Thread Footprint Optimization (`v0.4.3`)**:
            - Aligned all RustCrypto crates (`aes-gcm`/`chacha20poly1305`/`sha1`/`sha2`/`blake2 0.11`, `p256 0.14`, `hmac 0.13`, `getrandom 0.4`) to the `dimpl 0.9.0` generation (37 duplicate crates → **0**) with `fat LTO`, `-C force-unwind-tables=no`, and hybrid `-O3`/`-Os` compilation (`linux-x86_64-musl` `2.78 → 1.95 MiB`, `linux-aarch64-musl` `2.31 → 1.62 MiB`, `macos-arm64` `2.08 → 1.49 MiB`, while accelerating single-core AEAD throughput)
            - Replaced `tiny_http`, `serde`/`serde_json`, `crc32fast`, and Unix `ctrlc` with a zero-dependency single-thread `mio::Poll` HTTP telemetry server (64 KiB stack, 0 idle wakeups), hand-written RFC 8259 JSON, 64 B nibble-LUT IEEE CRC32, and async-signal-safe `sigaction` + self-pipe shutdown (`--workers 1` now runs in **1 OS thread** pure tunnel / **2 OS threads** with `--status-http`, down from 8)
            - MTU-sized per-worker UDP buffers, lazy-growing `SeenTxidCache`/`SharedV4Registry`, single-suite `CipherBackend` enum, boxed `Dtls`, and immediate post-handshake key/buffer cleanup
          - **V4.0 Seamless L4 UDP Carrier & Decoupled Health Telemetry (`v0.4.0`–`v0.4.2`)**:
            - 1-RTT ICE path migration (`HKDF-SHA256` per-session `ice-pwd-v4` + unpadded `57B 0xFFFD` challenge `<= 1.32x` anti-reflection bound) and timed/byte-budget MBB rotation (`0xFFFC` encrypted atomic `backend_sock` handover, 0 backend source-port change across single/multi-worker)
            - Strictly off-hot-path outer link telemetry via atomic `--status-file` JSON and read-only `--status-http` (`/status`, `/health`, `/healthz`, `/metrics`)
          - **RFC 9147 DTLS 1.3 + DTLS 1.2 Auto-Sense (`dimpl 0.9.0`) & Dual-SSRC SRTP/SRTCP**:
            - Encrypted mutual ECDSA P-256 certificates (`--dtls-min-version 1.3` anti-downgrade lock), dual-SSRC `PT=111` Opus (`<= 50 pps`) + `PT=96` Video with strict `M=1` causality, orthogonal AEAD nonce domains, 2048-packet RFC 6479 replay rings, and 100% 0-byte Silent Drop against active probes
          - **Dual-mode 12-scenario `webrtc-cloak selftest` suite** (`--server-host` live remote mode with in-band `0xFFFE` SRTP probe echo + `--local` offline fault-injection sandbox + CPU crypto/P-256 benchmarks)

          > **Disclaimer**: Strictly for network protocol learning, academic research, and authorized testing under the MIT License.
          """
          lines = [line[10:] if line.startswith(" " * 10) else line for line in notes.splitlines()]
          open("/tmp/release_notes.md", "w", encoding="utf-8").write("\n".join(lines).strip() + "\n")
          PYEOF
          gh release create "$TAG" ./* \
            --title "WebRTC-Cloak $TAG" \
            --notes-file /tmp/release_notes.md \
            --latest || gh release upload "$TAG" ./* --clobber
