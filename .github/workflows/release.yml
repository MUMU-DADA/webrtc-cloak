name: Release Multi-Arch Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.8.0)"
        required: true
        default: "v0.8.0"

permissions:
  contents: write

jobs:
  test:
    name: Cargo Test (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        working-directory: webrtc-cloak-rs
        run: cargo test --all-targets

  build:
    name: Build ${{ matrix.asset }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux static musl (11 architectures, zero libc/C deps)
          - asset: linux-x86_64
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-aarch64
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7hf
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv7
            target: armv7-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armhf
            target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-arm
            target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-armv5te
            target: armv5te-unknown-linux-musleabi
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-i686
            target: i686-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-riscv64
            target: riscv64gc-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-loongarch64
            target: loongarch64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          - asset: linux-powerpc64le
            target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            pkg: tar.gz
          # macOS (Apple Silicon + Intel)
          - asset: macos-arm64
            target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          - asset: macos-x86_64
            target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            pkg: tar.gz
          # Windows MSVC (x86_64 + ARM64 + i686)
          - asset: windows-x86_64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip
          - asset: windows-i686
            target: i686-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            pkg: zip

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary (Unix)
        if: runner.os != 'Windows'
        working-directory: webrtc-cloak-rs
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --target "${{ matrix.target }}"

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        working-directory: webrtc-cloak-rs
        shell: pwsh
        run: |
          cargo build --release --target "${{ matrix.target }}"

      - name: Package artifact (tar.gz)
        if: matrix.pkg == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          NAME="webrtc-cloak-${TAG}-${{ matrix.asset }}"
          mkdir -p "release_out/${NAME}"
          cp "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak" "release_out/${NAME}/webrtc-cloak"
          chmod +x "release_out/${NAME}/webrtc-cloak"
          cp README.md LICENSE "release_out/${NAME}/"
          tar -C release_out -czf "release_out/${NAME}.tar.gz" "${NAME}"
          rm -rf "release_out/${NAME}"

      - name: Package artifact (zip)
        if: matrix.pkg == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.ref_name }}"
          $name = "webrtc-cloak-$tag-${{ matrix.asset }}"
          New-Item -ItemType Directory -Force -Path "release_out/$name" | Out-Null
          Copy-Item "webrtc-cloak-rs/target/${{ matrix.target }}/release/webrtc-cloak.exe" "release_out/$name/webrtc-cloak.exe"
          Copy-Item "README.md", "LICENSE" "release_out/$name/"
          Compress-Archive -Path "release_out/$name" -DestinationPath "release_out/$name.zip" -Force
          Remove-Item -Recurse -Force "release_out/$name"

      - uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset }}
          path: release_out/*

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: all_assets
          merge-multiple: true

      - name: Generate SHA256SUMS and create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          cd all_assets
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          python3 - "$TAG" <<'PYEOF'
          import sys
          tag = sys.argv[1]
          notes = f"""## WebRTC-Cloak {tag}

          Pure-Rust, zero-C-dependency RFC 7983 WebRTC (ICE STUN + Chrome/BoringSSL-aligned DTLS 1.3 `dimpl` + Dynamic RFC 8285 Dual-SSRC SRTP + Compound SRTCP) single-port UDP encapsulation and optional zero-loopback embedded proxy research prototype.

          > **Wire Compatibility**: `v0.8.0` is **100% wire-compatible with `v0.7.0` and `v0.7.1`** and can be upgraded independently. (Relative to `v0.6.x`, `v0.7+` requires upgrading both endpoints together; behind DNAT/port-forwarding, pass matching `--stun-scope <TAG>`.)

          ### Included Platforms (16 OS / Arch Builds)
          - **Linux Static musl (zero libc/C dependency)**: `x86_64`, `aarch64`, `armv7hf`, `armv7`, `armhf`, `arm`, `armv5te`, `i686`, `riscv64`, `loongarch64`, `powerpc64le`
          - **macOS**: `arm64` (Apple Silicon), `x86_64` (Intel)
          - **Windows (MSVC)**: `x86_64`, `arm64`, `i686`
          - **Checksums**: `SHA256SUMS.txt`

          ### What's New in `v0.8.0` (100% wire-compatible with `v0.7.x`)
          - **Zero-Decrypt Pass-Through Relay (`webrtc-cloak relay --upstream-mode passthrough`)**:
            - Pure L4 IPv6↔IPv4 UDP forwarding with **zero decryption/encryption and zero PSK requirement** on the relay node (`--psk` optional), Linux `recvmmsg`/`sendmmsg` batching (`--udp-batch`), idle session GC, and bounded LRU eviction
            - Pins an isolated connected upstream UDP socket per client source port, preserving full end-to-end client↔exit DTLS 1.3 + Dual-SSRC SRTP, `--lane-hunt` multi-port probing, and 0ms MBB rotation through the relay while cutting 1-vCPU relay load by ~3× (`~75% → ~25%`, `~3 MB` RSS)
          - **Zero-Downtime `SIGHUP` Mode Hot-Switching (`--hot-config <PATH>`)**:
            - **Zero-dependency hot-config parser** (`key=value` & flat JSON) + async-signal-safe Unix `SIGHUP` self-pipe wakeup (`RELOAD_PIPE_TOKEN`)
            - **`relay` transitional `AB` dual-mode**: Live-switches between `passthrough`, `cloak`, and `bypass` (or changes upstream host/port/PSK) without ever closing the bound UDP listening port; existing sessions drain cleanly with 0 dropped packets while new flows immediately follow the updated policy, automatically dropping unused crypto state once drained (also supports `--passthrough-fallback` simultaneous dual-mode)
            - **`proxy --client` in-process Make-Before-Break**: Never closes local SOCKS5 or `--tcp-forward` listeners; pre-warms a standby outer Cloak + inner QUIC tunnel in an isolated token slot, atomically promotes once `CtrlHello` is ready, drains in-flight TCP streams on the previous tunnel cleanly to completion, and auto-rolls back on handshake timeout (`--hot-switch-timeout`, default `12s`) with zero impact on live traffic
          - **Camouflage-Preserving Embedded Proxy Performance Optimization**:
            - Enabled `opt-level = 3` for `quinn-proto` and `bytes`
            - Calibrated Brutal `CWND_BDP_GAIN` from `1.20` → `1.00` to align with `quinn-proto`'s built-in `1.25×` pacer (eliminating high-BDP `fq flows_plimit` tail drops)
            - Added Linux `timerfd` nanosecond event-loop pacing wakeup (`PROXY_TIMER_TOKEN`) eliminating sub-millisecond `epoll_wait` rounding stalls, plus up to 16 strictly frame-separated video-frame bursts pipelined into a shared 32-pkt `sendmmsg` batch — improving high-RTT WAN throughput by `+37%` while preserving 100% WebRTC 1200B + `500..=979B` video-frame tail camouflage (`63/63` automated tests passing)

          ### Highlights from `v0.7.0` / `v0.7.1`
          - **Optional Zero-Loopback Embedded Hy2-Like Proxy (`webrtc-cloak proxy`, Cargo feature `embedded-proxy` default ON; omit via `--no-default-features`)**:
            - Embeds Sans-IO `quinn-proto` inside the same single-thread `mio::Poll` loop with a custom No-op inner QUIC crypto provider (`tag_len == 0`, zero `rustls`, zero double AEAD; outer WebRTC-Cloak DTLS 1.3 PFS + SRTP provides full encryption), Hysteria 2-style Brutal loss-compensated congestion control (`--up`/`--down`/`--max-up`/`--max-down`), and RFC 9221 unreliable QUIC Datagram UDP forwarding (with automatic fragmentation/reassembly)
            - Client exposes local SOCKS5 (`TCP CONNECT` + `UDP ASSOCIATE`, default `127.0.0.1:19548`, `--no-socks`) and repeatable L4 `--tcp-forward LOCAL=TARGET`; Server performs non-blocking `mio` TCP/UDP egress with a 2-thread async DNS pool and post-DNS CIDR ACL (`--acl-allow`/`--acl-deny`, private-IP deny by default unless `--allow-private`, `--outbound-ipv4-only`)
            - Supports both **Forward** (`proxy --client` ↔ `proxy --server`) and **Reverse** (`proxy --client --reverse` listening for outbound `proxy --server --reverse`, NAT-to-NAT zero inbound port on exit) as well as 3-hop `relay --upstream-mode reverse` (`--reverse-listen-port`)
            - Persistent idle tunnel (`132s` silence = `0` SRTP beacons, `0` DTLS teardowns), automatic orphan TCP/QUIC cleanup on reverse `NewConnection` after peer `SIGKILL`, and bidirectional bulk TCP→QUIC video-frame tail shaping (`~10.4–10.7%` packets in `[450, 1150]B`, `1.6–2.0 Gbps` loopback direct throughput, `0.1–0.4ms` interactive p95, zero multi-stream starvation)
          - **Chrome/BoringSSL DTLS 1.3 Hardening (`patches/dimpl`)**:
            - Default `--dtls-min-version 1.3` (`V13Only`, 0% MITM downgrade, 0 plaintext `CN=WebRTC` cert leakage; explicit `auto` retains RFC 8446 §4.1.3 `DOWNGRD\\x01` sentinel)
            - 0% `HelloRetryRequest` after authenticated ICE STUN (1-RTT direct `ServerHello`), 0% `EXT_PADDING (0x0015)` zero-blob, single consistent per-process MTU, unified Chrome cipher-suite order & `use_srtp` `[0x0007, 0x0008, 0x0001]`, BoringSSL-pinned GREASE extension bookends (`exts[0]` empty, `exts[last]` `0x00`) with interior Fisher-Yates shuffle
            - RFC 9147 §4.2 randomized inner plaintext padding on `Handshake`, `Ack`, and `Alert` records (eliminates static Flight-4/Flight-5/ACK/`close_notify` lengths), plus coalesced Flight-4 partial-handled tail recovery (`10/10` recover in `274–409ms`), `record_seq == 0` reset guard, and `< 9ms` client poisoned-`ServerHello` fast fail
          - **Endpoint-Scoped STUN HKDF, Per-Session PFS Keepalives & Regular Nomination**:
            - `derive_stun_scope_key_for` isolates ports and `cloak` vs `bypass` domains via HKDF-SHA256 (`0/8` cross-port / cross-mode replay; supports `--stun-scope <TAG>` and `--upstream-stun-scope <TAG>` for DNAT)
            - Tightened STUN freshness to `±10s`, `SeenTxidCache` to `2.5s / 2x` pre-DTLS only (burned on DTLS start), and switched `Ready` RFC 7675 keepalives (req & resp) to per-session DTLS-PFS `mi_key_mig` with fresh `txid` per retry (eliminates post-`SIGKILL` false-64B zombie replies & `>90s` post-close replay; `--keepalive 0` guarded by `dl_deadlock`)
            - RFC 8445 regular nomination for `--lane-hunt` (Chrome `4:4` Base64 `ufrag`, shared `tie_breaker`, decremented `PRIORITY`, `USE-CANDIDATE=false` probes → `true` winner) backed by `HuntUfragTable` (`4s` same-IP active / `20s` unnominated tombstone / `90s` locked & post-close tombstone); minimal `68B` RFC 5389 STUN for non-DPI `bypass`
          - **Dynamic Multi-Element SRTP, Quantized 30/60 FPS Video Clock & Async Teardown**:
            - Dynamic `24B/28B` RFC 8285 RTP headers (`abs-send-time`/`ssrc-audio-level` + `TWCC` + `MID`, graceful `20B` MTU-constrained fallback preserving `1422B` zero-frag under `1488B` PPPoE MTU), `~12.5%` RFC 3550 `P=1` (`0xB0`) padding when `pad_len >= 4`, `0..63B` regular padding, smooth widening for tiny spilled Video ACK packets
            - 30/60 FPS quantized 90 kHz video clock (`min_dt >= 1320` ticks, `<= 60` pkts/frame, zero mechanical 3-pkt micro-frames), zero `0xFFFE` probes from idle `PreWarm`, symmetric `25–45s` long-trickle SRTCP RR, and asynchronous `SRTCP BYE → DTLS close_notify` teardown (`18..95ms` runtime / `22..65ms` `SIGTERM`)
          - **Portable 32/64-bit & Full-Arch SIMD**:
            - Portable `BrutalRateHandle` (lock-free `AtomicU64` on 64-bit, `Mutex<u64>` fallback on 32-bit `armv5te`), alongside `patches/polyval` (AVX + Legacy SSE2 `PCLMULQDQ`), `patches/poly1305` (64-bit `radix-2^44`), x86 `AVX-512` ChaCha20, Linux `--udp-batch`, and `56/56` tests passing (`46/46` with `--no-default-features`)

          > **Disclaimer**: Strictly for network protocol learning, academic research, and authorized testing under the MIT License.
          """
          lines = [line[10:] if line.startswith(" " * 10) else line for line in notes.splitlines()]
          open("/tmp/release_notes.md", "w", encoding="utf-8").write("\n".join(lines).strip() + "\n")
          PYEOF
          gh release create "$TAG" ./* \
            --title "WebRTC-Cloak $TAG" \
            --notes-file /tmp/release_notes.md \
            --latest || gh release upload "$TAG" ./* --clobber
