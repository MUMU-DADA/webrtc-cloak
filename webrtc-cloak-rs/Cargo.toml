[package]
name = "webrtc-cloak"
version = "0.6.0"
edition = "2021"
license = "MIT"
description = "Pure-Rust RFC 7983 WebRTC (ICE STUN + DTLS 1.3/1.2 + Dual-SSRC SRTP/SRTCP) UDP encapsulation research prototype"

[dependencies]
aes = "0.9"
aes-gcm = "0.11"
blake2 = "0.11"
chacha20poly1305 = "0.11"
dimpl = { version = "0.9.0", default-features = false, features = ["rust-crypto"] }
getrandom = "0.4"
hmac = "0.13"
mio = { version = "1.0", features = ["os-poll", "net", "os-ext"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
pico-args = "0.5"
poly1305 = "0.9"
polyval = "0.7"
sha1 = "0.11"
sha2 = "0.11"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ctrlc = { version = "3.4", features = ["termination"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
# Keep the root crate at -O3 so monomorphized AEAD hot-path calls (aes-gcm/chacha20poly1305)
# retain full SIMD/unrolling throughput, while optimizing all cold dependencies for size (-Os).
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package."*"]
opt-level = "s"

# Keep hot-path data-plane AEAD / hash crates at -O3 so SIMD/unrolling throughput stays at 100%.
[profile.release.package.aes]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.ghash]
opt-level = 3
[profile.release.package.polyval]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3

[patch.crates-io]
poly1305 = { path = "patches/poly1305" }
polyval = { path = "patches/polyval" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(chacha20_avx512)'] }
