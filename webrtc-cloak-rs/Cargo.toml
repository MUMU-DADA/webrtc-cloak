[package]
name = "webrtc-cloak"
version = "0.4.1"
edition = "2021"
license = "MIT"
description = "Pure-Rust RFC 7983 WebRTC (ICE STUN + DTLS 1.3/1.2 + Dual-SSRC SRTP/SRTCP) UDP encapsulation research prototype"

[dependencies]
aes-gcm = "0.10"
blake2 = "0.10"
chacha20poly1305 = "0.10"
crc32fast = "1.4"
ctrlc = { version = "3.4", features = ["termination"] }
dimpl = { version = "0.9.0", default-features = false, features = ["rust-crypto"] }
getrandom = "0.2"
hmac = "0.12"
mio = { version = "1.0", features = ["os-poll", "net"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2.6"
tiny_http = { version = "0.12", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
