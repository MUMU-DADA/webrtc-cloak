[package]
name = "webrtc-cloak"
version = "0.3.3"
edition = "2021"
license = "MIT"
description = "Pure-Rust RFC 7983 WebRTC (ICE STUN + DTLS 1.2 + SRTP/SRTCP) UDP encapsulation research prototype"

[dependencies]
aes-gcm = "0.10"
blake2 = "0.10"
chacha20poly1305 = "0.10"
crc32fast = "1.4"
dimpl = { version = "0.9.0", default-features = false, features = ["rust-crypto"] }
getrandom = "0.2"
hmac = "0.12"
mio = { version = "1.0", features = ["os-poll", "net"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
sha1 = "0.10"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
subtle = "2.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
