[target.aarch64-apple-darwin]
rustflags = [
  "-C", "force-unwind-tables=no",
]

[target.x86_64-apple-darwin]
rustflags = [
  "-C", "force-unwind-tables=no",
  "--cfg", "chacha20_avx512",
]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "target-cpu=x86-64",
  "-C", "force-unwind-tables=no",
  "--cfg", "chacha20_avx512",
]

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "force-unwind-tables=no",
]

