<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="WebRTC-Cloak Performance Benchmarks">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="barCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="barEmerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="barAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect x="0" y="0" width="960" height="480" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="958" height="478" rx="15" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <circle cx="34" cy="30" r="5" fill="#38bdf8"/>
  <text x="48" y="36" class="sans" font-size="18" font-weight="700" fill="#f8fafc">WebRTC-Cloak 性能基准跑分 · Performance Benchmarks</text>
  <text x="48" y="56" class="sans" font-size="11.5" fill="#94a3b8">Pure Rust · Zero C Deps · 1200–1350B Payload · 自有实验环境实测数据</text>
  <rect x="794" y="18" width="142" height="28" rx="14" fill="#0f2942" stroke="#0ea5e9" stroke-opacity="0.45"/>
  <text x="865" y="36" class="mono" font-size="11.5" font-weight="600" fill="#38bdf8" text-anchor="middle">v0.4.2 · 实测基准</text>

  <!-- Left Card: Single-Core Crypto Microbenchmark -->
  <rect x="24" y="74" width="446" height="304" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
  <text x="42" y="100" class="sans" font-size="13.5" font-weight="700" fill="#e2e8f0">单核加解密微基准 (Microbench · Mbps)</text>
  <text x="42" y="117" class="sans" font-size="10.5" fill="#64748b">wrap + unwrap 往返吞吐 · 1200–1260B 载荷 · 刻度 0–11,000 Mbps</text>

  <!-- Left Row 1 -->
  <text x="42" y="144" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">Apple Silicon (ARM64) · AES-128-GCM</text>
  <text x="452" y="144" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="end">10,573 Mbps</text>
  <rect x="42" y="152" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="42" y="152" width="394" height="11" rx="5.5" fill="url(#barCyan)"/>

  <!-- Left Row 2 -->
  <text x="42" y="192" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">x86_64 云服务器 (1W) · AES-128-GCM</text>
  <text x="452" y="192" class="mono" font-size="11.5" font-weight="700" fill="#60a5fa" text-anchor="end">3,229 Mbps</text>
  <rect x="42" y="200" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="42" y="200" width="120" height="11" rx="5.5" fill="url(#barBlue)"/>

  <!-- Left Row 3 -->
  <text x="42" y="240" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">Apple Silicon (ARM64) · ChaCha20-Poly1305</text>
  <text x="452" y="240" class="mono" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="end">2,696 Mbps</text>
  <rect x="42" y="248" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="42" y="248" width="100" height="11" rx="5.5" fill="url(#barEmerald)"/>

  <!-- Left Row 4 -->
  <text x="42" y="288" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">x86_64 低功耗软路由 (1W) · AES-128-GCM</text>
  <text x="452" y="288" class="mono" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="end">2,140 Mbps</text>
  <rect x="42" y="296" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="42" y="296" width="80" height="11" rx="5.5" fill="url(#barPurple)"/>

  <!-- Left Row 5 -->
  <text x="42" y="336" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">Apple Silicon (ARM64) · BLAKE2b-128</text>
  <text x="452" y="336" class="mono" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="end">1,282 Mbps</text>
  <rect x="42" y="344" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="42" y="344" width="48" height="11" rx="5.5" fill="url(#barAmber)"/>

  <!-- Left Axis Ticks -->
  <text x="42" y="369" class="mono" font-size="9.5" fill="#475569">0</text>
  <text x="247" y="369" class="mono" font-size="9.5" fill="#475569" text-anchor="middle">5,500 Mbps</text>
  <text x="452" y="369" class="mono" font-size="9.5" fill="#475569" text-anchor="end">11,000 Mbps</text>

  <!-- Right Card: Full-Tunnel Loopback Throughput -->
  <rect x="490" y="74" width="446" height="304" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
  <text x="508" y="100" class="sans" font-size="13.5" font-weight="700" fill="#e2e8f0">端到端全隧道环回吞吐 (Full-Tunnel · Mbps)</text>
  <text x="508" y="117" class="sans" font-size="10.5" fill="#64748b">client → UDP → server 全栈加密转发 · 刻度 0–2,200 Mbps</text>

  <!-- Right Row 1 -->
  <text x="508" y="144" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">Apple Silicon (ARM64 · 1350B)</text>
  <text x="918" y="144" class="mono" font-size="11.5" font-weight="700" fill="#38bdf8" text-anchor="end">2,109 Mbps · 188 kpps</text>
  <rect x="508" y="152" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="508" y="152" width="393" height="11" rx="5.5" fill="url(#barCyan)"/>

  <!-- Right Row 2 -->
  <text x="508" y="192" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">Apple Silicon (ARM64 · 1200B)</text>
  <text x="918" y="192" class="mono" font-size="11.5" font-weight="700" fill="#60a5fa" text-anchor="end">1,740 Mbps · 181 kpps</text>
  <rect x="508" y="200" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="508" y="200" width="324" height="11" rx="5.5" fill="url(#barBlue)"/>

  <!-- Right Row 3 -->
  <text x="508" y="240" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">x86_64 低功耗软路由 (4W / 8S)</text>
  <text x="918" y="240" class="mono" font-size="11.5" font-weight="700" fill="#a78bfa" text-anchor="end">1,449 Mbps · 144 kpps</text>
  <rect x="508" y="248" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="508" y="248" width="270" height="11" rx="5.5" fill="url(#barPurple)"/>

  <!-- Right Row 4 -->
  <text x="508" y="288" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">x86_64 云服务器 (1W)</text>
  <text x="918" y="288" class="mono" font-size="11.5" font-weight="700" fill="#34d399" text-anchor="end">1,124 Mbps · 112 kpps</text>
  <rect x="508" y="296" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="508" y="296" width="209" height="11" rx="5.5" fill="url(#barEmerald)"/>

  <!-- Right Row 5 -->
  <text x="508" y="336" class="sans" font-size="11.5" font-weight="600" fill="#cbd5e1">x86_64 低功耗软路由 (1W)</text>
  <text x="918" y="336" class="mono" font-size="11.5" font-weight="700" fill="#fbbf24" text-anchor="end">900 Mbps · p50 50µs</text>
  <rect x="508" y="344" width="410" height="11" rx="5.5" fill="#1e293b"/>
  <rect x="508" y="344" width="168" height="11" rx="5.5" fill="url(#barAmber)"/>

  <!-- Right Axis Ticks -->
  <text x="508" y="369" class="mono" font-size="9.5" fill="#475569">0</text>
  <text x="713" y="369" class="mono" font-size="9.5" fill="#475569" text-anchor="middle">1,100 Mbps</text>
  <text x="918" y="369" class="mono" font-size="9.5" fill="#475569" text-anchor="end">2,200 Mbps</text>

  <!-- Footer KPI Strip -->
  <rect x="24" y="392" width="219" height="68" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
  <text x="40" y="411" class="sans" font-size="10.5" fill="#94a3b8">全核并发加密峰值 (12C)</text>
  <text x="40" y="434" class="mono" font-size="16" font-weight="700" fill="#38bdf8">77.1–81.1 Gbps</text>
  <text x="40" y="450" class="sans" font-size="10" fill="#64748b">Apple Silicon AES-128-GCM</text>

  <rect x="255" y="392" width="219" height="68" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
  <text x="271" y="411" class="sans" font-size="10.5" fill="#94a3b8">ECDSA P-256 证书签发</text>
  <text x="271" y="434" class="mono" font-size="16" font-weight="700" fill="#34d399">4,968 certs/s</text>
  <text x="271" y="450" class="sans" font-size="10" fill="#64748b">纯 Rust 动态自签缓存</text>

  <rect x="486" y="392" width="219" height="68" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
  <text x="502" y="411" class="sans" font-size="10.5" fill="#94a3b8">运行内存占用 (RSS)</text>
  <text x="502" y="434" class="mono" font-size="16" font-weight="700" fill="#a78bfa">2.1–2.8 MB</text>
  <text x="502" y="450" class="sans" font-size="10" fill="#64748b">x86_64 静态 musl 含遥测</text>

  <rect x="717" y="392" width="219" height="68" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.2"/>
  <text x="733" y="411" class="sans" font-size="10.5" fill="#94a3b8">静态发布二进制体积</text>
  <text x="733" y="434" class="mono" font-size="16" font-weight="700" fill="#fbbf24">2.9 MB</text>
  <text x="733" y="450" class="sans" font-size="10" fill="#64748b">Linux x86_64 · 零 C 依赖</text>
</svg>
